<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOSSTALK｜所有連結</title>
<meta name="description" content="BOSSTALK 官方連結總覽">
<meta property="og:title" content="BOSSTALK｜所有連結">
<meta property="og:description" content="BOSSTALK 官方連結總覽">
<meta property="og:image" content="https://ginginxl.github.io/b-tree/avatar_chalk_512.jpg">
<meta property="og:type" content="profile">
<style>
  :root{
    --navy:#0b1630; --navy2:#13244d; --gold:#e8b94a; --gold2:#ffd977;
    --text:#f5f1e6; --muted:#b9c2d8; --red:#c0392b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;color:var(--text);
    background:
      radial-gradient(1200px 600px at 50% -10%,#24407e 0%,transparent 60%),
      linear-gradient(180deg,var(--navy) 0%,#070e1f 100%);
    display:flex;justify-content:center;padding:40px 16px 60px;
  }
  /* 背景 K 線裝飾（純 CSS/SVG，原創） */
  .bg{position:fixed;inset:0;pointer-events:none;opacity:.12;z-index:0}
  main{position:relative;z-index:1;width:100%;max-width:560px;text-align:center}
  .avatar{width:112px;height:112px;border-radius:50%;object-fit:cover;
    border:3px solid var(--gold);box-shadow:0 0 0 6px rgba(232,185,74,.15),0 10px 30px rgba(0,0,0,.5)}
  h1{margin-top:14px;font-size:24px;letter-spacing:1px;color:var(--gold2)}
  .bio{margin-top:6px;color:var(--muted);font-size:14px;line-height:1.6}
  .socials{display:flex;justify-content:center;gap:14px;margin:18px 0 22px;flex-wrap:wrap}
  .socials a{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
    background:rgba(255,255,255,.06);border:1px solid rgba(232,185,74,.35);color:var(--gold2);
    text-decoration:none;font-size:13px;font-weight:700;transition:.2s}
  .socials a:hover{background:var(--gold);color:var(--navy)}
  .section{margin:22px 0 10px;font-size:12px;letter-spacing:3px;color:var(--gold);opacity:.85}
  .links{display:flex;flex-direction:column;gap:12px}
  .link{position:relative;display:flex;align-items:center;gap:12px;padding:15px 18px;border-radius:14px;
    text-decoration:none;color:var(--text);font-weight:600;font-size:15px;
    background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));
    border:1px solid rgba(232,185,74,.35);transition:transform .15s,box-shadow .15s,border-color .15s}
  .link:hover{transform:translateY(-2px);border-color:var(--gold);box-shadow:0 8px 24px rgba(232,185,74,.18)}
  .link .ico{font-size:20px;width:28px;flex:none}
  .link .txt{flex:1;text-align:left}
  .link .sub{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:2px}
  .link.featured{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--navy);border-color:var(--gold2)}
  .link.featured .sub{color:#3a2c08}
  .share{position:fixed;top:14px;right:14px;z-index:2;border:1px solid rgba(232,185,74,.5);
    background:rgba(11,22,48,.8);color:var(--gold2);border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--navy);
    padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.3s}
  .toast.show{opacity:1}
  footer{margin-top:34px;font-size:12px;color:var(--muted);opacity:.7}
</style>
</head>
<body>
<svg class="bg" viewBox="0 0 400 800" preserveAspectRatio="none" aria-hidden="true">
  <g stroke="#e8b94a" stroke-width="2">
    <line x1="30" y1="520" x2="30" y2="640"/><rect x="22" y="545" width="16" height="70" fill="#e8b94a"/>
    <line x1="80" y1="480" x2="80" y2="600"/><rect x="72" y="500" width="16" height="60" fill="none"/>
    <line x1="130" y1="430" x2="130" y2="560"/><rect x="122" y="450" width="16" height="80" fill="#e8b94a"/>
    <line x1="180" y1="460" x2="180" y2="580"/><rect x="172" y="480" width="16" height="50" fill="none"/>
    <line x1="230" y1="360" x2="230" y2="500"/><rect x="222" y="380" width="16" height="90" fill="#e8b94a"/>
    <line x1="280" y1="320" x2="280" y2="440"/><rect x="272" y="340" width="16" height="70" fill="#e8b94a"/>
    <line x1="330" y1="350" x2="330" y2="450"/><rect x="322" y="365" width="16" height="45" fill="none"/>
    <line x1="375" y1="250" x2="375" y2="390"/><rect x="367" y="270" width="16" height="90" fill="#e8b94a"/>
  </g>
</svg>

<button class="share" id="share">⤴ 分享</button>
<main>
  <img class="avatar" src="avatar_chalk_512.jpg" alt="BOSSTALK">
  <h1 id="name"></h1>
  <p class="bio" id="bio"></p>
  <nav class="socials" id="socials"></nav>
  <div id="groups"></div>
  <footer id="foot"></footer>
</main>
<div class="toast" id="toast">已複製連結</div>

<script>
/* ============ 只要改這一段 ============ */
const PROFILE = {
  name: "BOSSTALK",
  bio: "交易・市場・觀點｜所有官方連結都在這裡",
  footer: "© BOSSTALK"
};
// 社群小圖示（label 用 1~2 個字）
const SOCIALS = [
  { label: "IG",  url: "https://www.instagram.com/bosstalk1111/" },
  { label: "TG",  url: "https://t.me/+kC2SQ58OwgM5MDY1" },
  { label: "LINE", url: "https://line.me/ti/g2/CadP8PMWvsHTYBzUnKNZoRPFZ0_JeiMYh1MB5A?utm_source=invitation&utm_medium=link_copy&utm_campaign=default" },
  { label: "@",   url: "https://www.threads.com/@bosstalk_a" },
];
// 連結按鈕：group = 分區標題；featured: true = 金色重點按鈕
const LINKS = [
  { group: "交易所註冊", icon: "🎁", title: "OKX 註冊", sub: "用我的邀請連結開戶", url: "https://okx.com/join/M5XOSZ22", featured: true },
  { group: "交易所註冊", icon: "🎁", title: "Bybit 註冊", sub: "用我的邀請連結開戶", url: "https://www.bybit.com/invite?ref=Q6R1ML&medium=referral&utm_campaign=evergreen&share_to=link" },
  { group: "社群", icon: "💬", title: "Telegram 群組", sub: "即時訊號與討論", url: "https://t.me/+kC2SQ58OwgM5MDY1" },
  { group: "社群", icon: "🟢", title: "LINE 群組", sub: "加入 BOSSTALK LINE 社群", url: "https://line.me/ti/g2/CadP8PMWvsHTYBzUnKNZoRPFZ0_JeiMYh1MB5A?utm_source=invitation&utm_medium=link_copy&utm_campaign=default" },
  { group: "社群", icon: "📸", title: "Instagram", sub: "@bosstalk1111", url: "https://www.instagram.com/bosstalk1111/" },
  { group: "社群", icon: "🧵", title: "Threads", sub: "@bosstalk_a", url: "https://www.threads.com/@bosstalk_a" },
];
/* ===================================== */

const $ = id => document.getElementById(id);
$("name").textContent = PROFILE.name;
$("bio").textContent = PROFILE.bio;
$("foot").textContent = PROFILE.footer;
document.title = PROFILE.name + "｜所有連結";

SOCIALS.forEach(s => {
  const a = document.createElement("a");
  a.href = s.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = s.label; a.title = s.label;
  $("socials").appendChild(a);
});

const groups = {};
LINKS.forEach(l => (groups[l.group || ""] ||= []).push(l));
Object.entries(groups).forEach(([g, items]) => {
  if (g) { const h = document.createElement("div"); h.className = "section"; h.textContent = g; $("groups").appendChild(h); }
  const box = document.createElement("div"); box.className = "links";
  items.forEach(l => {
    const a = document.createElement("a");
    a.className = "link" + (l.featured ? " featured" : "");
    a.href = l.url; a.target = "_blank"; a.rel = "noopener";
    a.innerHTML = `<span class="ico">${l.icon || "🔗"}</span><span class="txt"></span><span>›</span>`;
    const t = a.querySelector(".txt"); t.textContent = l.title;
    if (l.sub) { const s = document.createElement("span"); s.className = "sub"; s.textContent = l.sub; t.appendChild(s); }
    box.appendChild(a);
  });
  $("groups").appendChild(box);
});

$("share").onclick = async () => {
  const url = location.href;
  if (navigator.share) { try { await navigator.share({ title: document.title, url }); return; } catch(e){} }
  await navigator.clipboard.writeText(url);
  $("toast").classList.add("show"); setTimeout(() => $("toast").classList.remove("show"), 1500);
};
</script>
</body>
</html>
