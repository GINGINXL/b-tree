<meta property="og:title" content="桃子｜所有連結"><meta property="og:description" content="桃子的卡牌世界：寶可夢卡、海賊王卡、開箱與收藏"><meta property="og:type" content="profile">
<style>:root{--bgfill:radial-gradient(900px 500px at 50% 0%,#ffe3ec 0%,transparent 70%),linear-gradient(160deg,#fff0f5 0%,#f3e8ff 50%,#e6f4ff 100%);--text:#3b2340;--muted:#7a5a80;--title:#d6457a;--accent:#ff6f9f;--ring:rgba(255,111,159,.22);--card:rgba(255,255,255,.78);--line:rgba(214,69,122,.25);--avbg:linear-gradient(135deg,#ffd1e0,#ffe9a8);--featured:linear-gradient(135deg,#ff6f9f,#a77bff);}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;color:var(--text);
  background:var(--bgfill);display:flex;justify-content:center;padding:40px 16px 60px;overflow-x:hidden}
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.deco > *{position:absolute}
main{position:relative;z-index:1;width:100%;max-width:560px;text-align:center}
.avatar{width:112px;height:112px;border-radius:50%;margin:0 auto;display:grid;place-items:center;font-size:58px;
  background:var(--avbg);border:3px solid var(--accent);box-shadow:0 0 0 6px var(--ring),0 10px 30px rgba(0,0,0,.25);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
h1{margin-top:14px;font-size:26px;letter-spacing:1px;color:var(--title)}
.bio{margin-top:6px;color:var(--muted);font-size:14px;line-height:1.6}
.socials{display:flex;justify-content:center;gap:14px;margin:18px 0 22px;flex-wrap:wrap}
.socials a{min-width:40px;height:40px;padding:0 8px;border-radius:999px;display:grid;place-items:center;background:var(--card);
  border:1px solid var(--line);color:var(--title);text-decoration:none;font-size:13px;font-weight:700;transition:.2s}
.socials a:hover{background:var(--accent);color:#fff}
.section{margin:22px 0 10px;font-size:12px;letter-spacing:3px;color:var(--accent);font-weight:700}
.links{display:flex;flex-direction:column;gap:12px}
.link{display:flex;align-items:center;gap:12px;padding:15px 18px;border-radius:16px;text-decoration:none;color:var(--text);
  font-weight:600;font-size:15px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(6px);
  transition:transform .15s,box-shadow .15s}
.link:hover{transform:translateY(-2px);box-shadow:0 8px 24px var(--ring)}
.link .ico{font-size:20px;width:28px;flex:none}.link .txt{flex:1;text-align:left}
.link .sub{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:2px}
.link.featured{background:var(--featured);color:#fff;border-color:transparent}.link.featured .sub{color:rgba(255,255,255,.85)}
.soon{padding:16px;border-radius:16px;border:1px dashed var(--line);color:var(--muted);font-size:14px;background:var(--card)}
.share{position:fixed;top:14px;right:14px;z-index:2;border:1px solid var(--line);background:var(--card);color:var(--title);
  border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer;backdrop-filter:blur(6px)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:8px 16px;
  border-radius:999px;font-size:13px;opacity:0;transition:.3s}.toast.show{opacity:1}
footer{margin-top:34px;font-size:12px;color:var(--muted)}
@keyframes float{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-10px) rotate(var(--r,0deg))}}
</style></head><body>

<script>
/* ============ 只要改這一段 ============ */
const PROFILE = {
  "name": "桃子 🍑",
  "bio": "寶可夢卡・海賊王卡｜開箱・收藏・行情",
  "footer": "© 桃子",
  "avatarEmoji": "🍑"
};
const SOCIALS = [
  {
    "label": "IG",
    "url": "https://www.instagram.com/bosstalk1111/"
  },
  {
    "label": "@",
    "url": "https://www.threads.com/@taozi00621"
  },
  {
    "label": "X",
    "url": "https://x.com/Taozi006"
  }
];
const LINKS = [
  {
    "group": "社群",
    "icon": "📸",
    "title": "Instagram",
    "sub": "@bosstalk1111",
    "url": "https://www.instagram.com/bosstalk1111/",
    "featured": true
  },
  {
    "group": "社群",
    "icon": "🧵",
    "title": "Threads",
    "sub": "@taozi00621",
    "url": "https://www.threads.com/@taozi00621"
  },
  {
    "group": "社群",
    "icon": "✖️",
    "title": "X",
    "sub": "@Taozi006",
    "url": "https://x.com/Taozi006"
  }
];
/* ===================================== */

const $ = id => document.getElementById(id);
$("name").textContent = PROFILE.name; $("bio").textContent = PROFILE.bio; $("foot").textContent = PROFILE.footer;
if (PROFILE.avatarImg) { const i = document.createElement("img"); i.src = PROFILE.avatarImg; i.alt = PROFILE.name; $("avatar").appendChild(i); }
else $("avatar").textContent = PROFILE.avatarEmoji || "🙂";
SOCIALS.forEach(s => { const a = document.createElement("a"); a.href = s.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = s.label; $("socials").appendChild(a); });
if (!LINKS.length) { const d = document.createElement("div"); d.className = "soon"; d.textContent = "連結準備中，敬請期待 ✨"; $("groups").appendChild(d); }
const groups = {}; LINKS.forEach(l => (groups[l.group || ""] ||= []).push(l));
Object.entries(groups).forEach(([g, items]) => {
  if (g) { const h = document.createElement("div"); h.className = "section"; h.textContent = g; $("groups").appendChild(h); }
  const box = document.createElement("div"); box.className = "links";
  items.forEach(l => { const a = document.createElement("a"); a.className = "link" + (l.featured ? " featured" : "");
    a.href = l.url; a.target = "_blank"; a.rel = "noopener";
    a.innerHTML = '<span class="ico"></span><span class="txt"></span><span>›</span>';
    a.querySelector(".ico").textContent = l.icon || "🔗"; const t = a.querySelector(".txt"); t.textContent = l.title;
    if (l.sub) { const s = document.createElement("span"); s.className = "sub"; s.textContent = l.sub; t.appendChild(s); }
    box.appendChild(a); });
  $("groups").appendChild(box); });
$("share").onclick = async () => { const url = location.href;
  if (navigator.share) { try { await navigator.share({ title: document.title, url }); return; } catch (e) {} }
  await navigator.clipboard.writeText(url); $("toast").classList.add("show"); setTimeout(() => $("toast").classList.remove("show"), 1500); };
</script></body></html>
